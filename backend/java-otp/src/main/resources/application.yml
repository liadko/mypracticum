spring.application.name: otp

# Redis connection (picked up by RedisConfig via @Value)
redis:
    host:localhost
    port:6379


# Default Spring Boot settings (you’ll add mail config later under profiles)
spring:
    application:
        name: otp-service

    profiles:
        active: smtp

    jackson:
        deserialization:
            fail-on-unknown-properties: true

springdoc:
    swagger-ui:
        path: /docs

server:
    error:
        include-exception: false      # don’t show exception class name
        include-stacktrace: never     # never include a stack trace
        include-message: always       # surface the top-level “message” field
        include-binding-errors: never # hide the full ‘errors’ array
    port: 8081